# Server Configuration
server.port=8080
spring.application.name=tirana-events

# Database Configuration (MySQL / phpMyAdmin — db: tiranaevents)
spring.datasource.url=jdbc:mysql://localhost:3306/tiranaevents?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
# CLEANUP #5: Changed ddl-auto from 'update' to 'validate' for production safety
# 'validate' only checks schema, won't alter database automatically
# Use Flyway/Liquibase or manual migrations for schema changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CLEANUP #4: Disable H2 console for security (not needed, using MySQL)
spring.h2.console.enabled=false

# JWT Configuration
# FIX BUG #3: CRITICAL - JWT secret MUST be set via environment variable
# NO DEFAULT VALUE for security - app will fail to start if JWT_SECRET env var is not set
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000
# Token expiration: 604800000ms = 7 days (for development)
# Production should use 86400000ms = 24 hours

# File Uploadx
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081,exp://192.168.*:19000}

# Notifications: in-app only (stored in MySQL). No Firebase required.
notifications.delivery=in-app
